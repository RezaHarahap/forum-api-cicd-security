name: Continuous Integration

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forumapi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: forumapi_test
      PGPASSWORD: postgres
      PGPORT: 5432
      ACCESS_TOKEN_KEY: ci_access_token_key
      REFRESH_TOKEN_KEY: ci_refresh_token_key
      ACCESS_TOKEN_AGE: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test environment file
        run: cp .test.env.example .test.env

      - name: Run database migrations
        run: npm run migrate:test up

      - name: Lint source code
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run functional tests
        run: npm run test:functional

      - name: Verify coverage
        run: npm run test:coverage
