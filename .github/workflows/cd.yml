name: Continuous Deployment

on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Deploy application through SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only origin "${{ github.ref_name }}"
            npm ci
            npm run migrate up
            npm prune --omit=dev
            sudo systemctl restart forum-api
            sudo systemctl is-active --quiet forum-api

      - name: Verify HTTPS deployment
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$APP_URL/health"
